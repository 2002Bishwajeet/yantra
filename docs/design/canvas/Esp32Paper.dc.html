  <style>
    body { margin: 0; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; color: #111111; }
    .col { display: flex; flex-direction: column; flex: none; }
    .line1 { display: flex; align-items: baseline; gap: 12px; height: 108px; }
    .line2 { display: flex; align-items: center; gap: 12px; height: 48px; font-size: 36px; line-height: 48px; }

    .word { font-size: 36px; line-height: 48px; }
    .dot { width: 24px; height: 24px; border-radius: 999px; flex: none; box-sizing: border-box; }
    .dot-ink { background: #111111; }
    .dot-dither { background: repeating-conic-gradient(#111111 0 25%, #F5F5F0 0 50%) 0 0 / 6px 6px; }
    .dot-dashed { border: 3px dashed #111111; }
    .rule { height: 3px; flex: none; background: repeating-linear-gradient(90deg, #111111 0 3px, #F5F5F0 3px 6px); }
    .row { display: flex; align-items: center; gap: 12px; height: 48px; font-size: 36px; line-height: 48px; flex: none; }
    .name { width: 240px; flex: none; }
    .age { margin-left: auto; text-align: right; }
  </style>
</helmet>
