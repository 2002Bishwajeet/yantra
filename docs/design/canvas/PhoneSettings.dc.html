<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" />
  <style>
    body { margin: 0; font-family: "Google Sans Flex", "Instrument Sans", system-ui, sans-serif; color: #191D18; }
    a { color: #48674B; text-decoration: none; } a:hover { color: #2F4E33; }
    .card { border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; flex: none; }
    .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.8px; line-height: 16px; text-transform: uppercase; color: #424940; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-weight: 500; }
    .mark { width: 10px; height: 10px; border-radius: 999px; flex: none; box-sizing: border-box; }
    .mark-needs { background: #48674B; }
    .mark-running { background: #7A6A45; }
    .mark-idle { border: 1.5px solid #727A70; }
    .mark-unknown { border: 1.5px dashed #727A70; }
    .mark-failed { background: #BA1A1A; }
    .pill { border-radius: 999px; font-size: 14px; font-weight: 500; line-height: 20px; padding: 10px 14px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; flex: none; }
    .row { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 6px 6px 6px 8px; min-height: 56px; box-sizing: border-box; }
    .t1 { font-size: 14px; font-weight: 500; line-height: 20px; color: #191D18; }
    .t2 { font-size: 12px; font-weight: 400; line-height: 16px; color: #424940; }
    .t3 { font-size: 13px; font-weight: 400; line-height: 18px; color: #424940; }
    .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track { height: 6px; border-radius: 3px; background: #ECEEE6; overflow: hidden; }
    .chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; line-height: 18px; min-height: 32px; box-sizing: border-box; }
    .icon-btn { width: 44px; height: 44px; border-radius: 999px; background: #E6E9E0; display: flex; align-items: center; justify-content: center; position: relative; }
    .tile { width: 36px; height: 36px; border-radius: 12px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex: none; }
    .state { display: inline-flex; align-items: center; gap: 6px; }
    .textbtn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; line-height: 20px; box-sizing: border-box; flex: none; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; color: #424940; }
    .nav-ind { width: 64px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
    .nav-label { font-size: 12px; font-weight: 500; line-height: 16px; }
    .back { width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none; }
    .section { display: flex; flex-direction: column; gap: 8px; flex: none; }
    .list { background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
    .item { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 8px 8px 16px; box-sizing: border-box; }
    .item + .item { border-top: 1px solid #C2C9BE; }
    .lead { width: 36px; height: 36px; border-radius: 999px; background: #E6E9E0; display: flex; align-items: center; justify-content: center; flex: none; }
    .chev { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F8FAF3; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 4px; padding: 0 12px 0 8px; height: 64px; flex: none; box-sizing: border-box;">
    <a href="#" class="back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191D18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></a>
    <h1 class="clip" style="margin: 0; font-size: 22px; font-weight: 700; line-height: 28px; flex: 1; min-width: 0;">Settings</h1>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0 16px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <section class="list">
        <a href="#" class="item">
          <div class="lead"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191D18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg></div>
          <div class="t1 clip" style="font-size: 15px; flex: 1; min-width: 0;">General</div>
          <div class="chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#727A70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
        </a>
        <a href="#" class="item">
          <div class="lead"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191D18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></div>
          <div class="t1 clip" style="font-size: 15px; flex: 1; min-width: 0;">Notifications</div>
          <div class="chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#727A70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
        </a>
        <a href="#" class="item">
          <div class="lead"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191D18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"></path></svg></div>
          <div class="t1 clip" style="font-size: 15px; flex: 1; min-width: 0;">Providers</div>
          <div class="chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#727A70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
        </a>
        <a href="#" class="item">
          <div class="lead"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191D18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"></rect><path d="M7 15l3-3-3-3M12 15h5"></path></svg></div>
          <div class="t1 clip" style="font-size: 15px; flex: 1; min-width: 0;">Agents</div>
          <div class="chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#727A70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
        </a>
        <a href="#" class="item">
          <div class="lead"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191D18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v3M15 12v2"></path></svg></div>
          <div class="t1 clip" style="font-size: 15px; flex: 1; min-width: 0;">Access</div>
          <div class="chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#727A70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
        </a>
        <a href="#" class="item">
          <div class="lead"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191D18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2v-.5a2 2 0 0 1 2-2h1.5a3.5 3.5 0 0 0 3.5-3.5A9 9 0 0 0 12 3z"></path><circle cx="7.5" cy="12" r="1"></circle><circle cx="9.5" cy="7.5" r="1"></circle><circle cx="14.5" cy="7.5" r="1"></circle></svg></div>
          <div class="t1 clip" style="font-size: 15px; flex: 1; min-width: 0;">Appearance</div>
          <div class="chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#727A70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
        </a>
        <a href="#" class="item">
          <div class="lead"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191D18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></div>
          <div class="t1 clip" style="font-size: 15px; flex: 1; min-width: 0;">About</div>
          <div class="chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#727A70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
        </a>
      </section>
    </div>
  </main>

</div>
</x-dc>
</body>
</html>
