<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" />
  <style>
    body { margin: 0; font-family: "Google Sans Flex", "Instrument Sans", system-ui, sans-serif; color: #191D18; }
    a { color: #48674B; text-decoration: none; } a:hover { color: #2F4E33; }
    .card { border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; min-height: 0; }
    .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.8px; line-height: 16px; text-transform: uppercase; color: #424940; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-weight: 500; }
    .mark { width: 10px; height: 10px; border-radius: 999px; flex: none; box-sizing: border-box; }
    .mark-needs { background: #48674B; }
    .mark-running { background: #7A6A45; }
    .mark-idle { border: 1.5px solid #727A70; }
    .mark-unknown { border: 1.5px dashed #727A70; }
    .mark-failed { background: #BA1A1A; }
    .pill { border-radius: 999px; font-size: 14px; font-weight: 500; line-height: 20px; padding: 8px 18px; display: inline-flex; align-items: center; gap: 6px; }
    .row { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; }
    .t1 { font-size: 14px; font-weight: 500; line-height: 20px; color: #191D18; }
    .t2 { font-size: 12px; font-weight: 400; line-height: 16px; color: #424940; }
    .track { height: 6px; border-radius: 3px; background: #FFFFFF; overflow: hidden; }
    .chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; line-height: 18px; min-height: 32px; box-sizing: border-box; }
    .icon-btn { width: 40px; height: 40px; border-radius: 999px; background: #E6E9E0; display: flex; align-items: center; justify-content: center; position: relative; }
    .tile { width: 36px; height: 36px; border-radius: 12px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex: none; }
    .state { display: inline-flex; align-items: center; gap: 6px; }
    .textbtn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; line-height: 20px; box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 1440px; height: 1024px; background: #F8FAF3; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; height: 64px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 28px; height: 28px; border-radius: 999px; background: #48674B;"></div>
      <div style="font-size: 22px; font-weight: 700; line-height: 28px;">Yantra</div>
    </div>
    <nav style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #E6E9E0;">
      <a href="#" class="pill" style="color: #424940;">Dashboard</a>
      <a href="#" class="pill" style="background: #D6E8D0; color: #3B4B39;">Fleet</a>
      <a href="#" class="pill" style="color: #424940;">Machines</a>
      <a href="#" class="pill" style="color: #424940;">Usage</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 24px; padding: 8px 12px 8px 16px; border-radius: 999px; background: #E6E9E0;">
        <span style="font-size: 14px; line-height: 20px; color: #424940;">Search anything</span>
        <span class="mono" style="font-size: 12px; line-height: 16px; padding: 2px 8px; border-radius: 6px; background: #FFFFFF; color: #424940;">⌘K</span>
      </div>
      <div class="icon-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191D18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span class="mono" style="position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #BA1A1A; color: #FFFFFF; font-size: 11px; line-height: 18px; text-align: center; box-sizing: border-box;">3</span>
      </div>
      <div style="width: 36px; height: 36px; border-radius: 999px; background: #CBE8C6; color: #2F4E33; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">B</div>
    </div>
  </header>

  <main style="display: flex; flex-direction: column; gap: 16px; padding: 8px 24px 24px 24px; flex: 1; min-height: 0;">

    <div style="display: flex; align-items: center; height: 48px; flex: none;">
      <h1 style="margin: 0; font-size: 44px; font-weight: 700; line-height: 48px;">landing-v2</h1>
    </div>

    <section class="card" style="flex: none; width: 640px; background: #ECEEE6; padding: 24px; gap: 16px;">
      <div class="state" style="gap: 10px; font-size: 14px; font-weight: 500; line-height: 20px; color: #424940;"><span class="mark mark-unknown"></span>not found</div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 24px;">No workspace is called landing-v2.</h2>
        <p style="margin: 0; font-size: 15px; line-height: 22px; color: #424940;">The fleet lists the ones there are.</p>
      </div>
      <div style="display: flex;">
        <a href="#" class="textbtn" style="background: #D6E8D0; color: #3B4B39; padding: 10px 18px; gap: 6px;">Fleet
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B4B39" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
      </div>
    </section>

  </main>
</div>
</x-dc>
</body>
</html>
