<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Safari takes its home-screen icon from here and not from the manifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Yantra</title>
    <!-- shell/prefs.ts's key, read here so the theme and density land before
         the first paint rather than a frame after it. -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('yantra.prefs'))
        if (p && p.v === 1) {
          if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme
          if (p.density === 'compact') document.documentElement.dataset.density = 'compact'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
