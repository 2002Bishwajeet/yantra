<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Safari takes its home-screen icon from here and not from the manifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Yantra</title>
    <!-- --md-sys-color-surface's two values (tokens.css); themeColor.test.ts holds them equal. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" data-scheme="light" content="#F6F0E2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" data-scheme="dark" content="#151714" />
    <!-- Blocks the first paint on purpose, and is a file because the
         daemon's policy runs no inline script (Y-785). -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
