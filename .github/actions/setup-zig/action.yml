name: Setup Zig
description: >-
  Install the zig that cargo-zigbuild shells out to. The version is written
  here and nowhere else, so the CI cross job and the release matrix cannot pin
  two different compilers.

runs:
  using: composite
  steps:
    # Bumping zig is a one-line change in this file. Keep it in step with the
    # zig developers install locally (docs/development.md) — cargo-zigbuild
    # passes our flags straight through, so a version skew shows up as a link
    # error in CI that nobody can reproduce on their laptop.
    - name: Install zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.16.0
