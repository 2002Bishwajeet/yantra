# Separate from ci.yml on purpose: no Rust job may ever acquire a Node
# dependency (R-24), and the path filter keeps this off Rust-only pull requests.
name: web

on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned because @babel/core resolves to a different major on a different
      # Node, silently, from the same install line (R8 §6).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx tsc --noEmit -p e2e/tsconfig.json
      # Runs `npm run compiled`, which fails if the React Compiler emitted no
      # memo caches — a bail-out is otherwise silent and exits 0.
      - run: npm run build
      - run: npm test
      # D3 §9.1 and ADR-0024 §7: 145 KiB first load, 80 KiB of fonts, or red.
      # Advisory until Y-346 replaces `/`: the old page still carries the
      # shadcn sheet beside the Material tokens (149.6 KiB on 2026-09-06).
      - run: npm run budget -- --no-build
        continue-on-error: true

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-24.04
    # The image the screenshot baselines are rendered in (playwright.config.ts):
    # one Chromium, one set of fonts, here and on a developer's box.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    # One job per form factor: three sizes triple the run (plan §7).
    strategy:
      fail-fast: false
      matrix:
        project: [phone, tablet, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run e2e -- --project ${{ matrix.project }}
      # The report is where a layout diff is legible.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.project }}
          path: |
            web/e2e/report/
            web/e2e/test-results/
          retention-days: 7
