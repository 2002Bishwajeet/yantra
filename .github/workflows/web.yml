# Separate from ci.yml on purpose: no Rust job may ever acquire a Node
# dependency (R-24), and the path filter keeps this off Rust-only pull requests.
name: web

on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned because @babel/core resolves to a different major on a different
      # Node, silently, from the same install line (R8 §6).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      # Runs `npm run compiled`, which fails if the React Compiler emitted no
      # memo caches — a bail-out is otherwise silent and exits 0.
      - run: npm run build
      - run: npm test
