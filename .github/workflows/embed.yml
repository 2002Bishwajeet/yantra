# The only job in the repo that builds Rust from npm's output, and the reason it
# is a workflow of its own rather than a job in ci.yml: ci.yml has no path filter,
# so a Node step there would run on every Rust pull request — R-24 in full, on the
# first day. The five jobs in ci.yml stay Node-free, and `just no-node` reds the
# build if that ever stops being true.
#
# The filter names the two things that can break this build and nothing else: the
# crate whose feature-gated code compiles the assets in, and the assets. A change
# to yantra-core or the CLI cannot affect it, and pays nothing for it.
name: embed

on:
  pull_request:
    paths:
      - 'crates/yantrad/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'justfile'
      - '.github/workflows/embed.yml'
  push:
    branches: [main]
    paths:
      - 'crates/yantrad/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'justfile'
      - '.github/workflows/embed.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  embed:
    name: appliance with the dashboard embedded
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned for web.yml's reason: the same install line resolves differently
      # on a different Node, silently.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Set up zig
        uses: ./.github/actions/setup-zig
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just,cargo-nextest,cargo-zigbuild
      # One invocation, so the npm build both recipes depend on happens once.
      - run: just test-embedded appliance-embedded

      # A feature that silently embedded nothing would pass every other check
      # here. Assert the built bundle's own name is in the binary, the way the
      # cross job asserts the ELF header rather than trusting it.
      - name: Assert the dashboard is actually inside the binary
        run: |
          set -euo pipefail
          bin=target/aarch64-unknown-linux-musl/release/yantrad
          asset=$(basename "$(ls web/dist/assets/index-*.js)")
          if ! grep -qa -- "$asset" "$bin"; then
            echo "::error::$asset is not in $bin, so the dashboard was not embedded"
            exit 1
          fi
          echo "embedded $asset; $(stat -c %s "$bin") bytes"
