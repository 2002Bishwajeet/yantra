# Every job below runs a recipe from the justfile, so `just ci` locally and a
# green PR mean the same thing. Add a new check to the justfile first, then
# give it a job here — never the other way round.
#
# No version is pinned in this file. The Rust toolchain — channel, components
# and the aarch64 target — comes from rust-toolchain.toml via the shared
# .github/actions/setup-rust action; zig comes from .github/actions/setup-zig.
# Both are shared with release.yml, so there is one place to bump each.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded pushes to a PR branch are cancelled; pushes to main are not, so
# every commit that lands keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    # A PR that touches no Rust input skips the Rust jobs; a skipped required check passes (Y-607).
    # A push to main, or a failed read here, runs everything.
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then printf 'rust=true\nmacos=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          printf '%s\n' "$files"
          rust='^(crates/|box/|\.cargo/|\.github/actions/|\.github/workflows/ci\.yml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|rustfmt\.toml$|deny\.toml$|justfile$|install\.sh$|web/src/contract\.gen\.ts$)'
          if grep -qE "$rust" <<<"$files"; then echo rust=true; else echo rust=false; fi >> "$GITHUB_OUTPUT"
          # What a Mac runs differently: the remote scripts and the code that sends them (Y-661).
          macos='^(crates/yantra-core/src/((agent|chat|claude|doctor|install|keep|probe|remote|shells|ssh|tmux)[^/]*|[^/]*\.sh)$|crates/yantra-core/tests/macos\.rs$|crates/yantrad/src/chat\.rs$|\.github/actions/|\.github/workflows/ci\.yml$|justfile$|rust-toolchain\.toml$)'
          if grep -qE "$macos" <<<"$files"; then echo macos=true; else echo macos=false; fi >> "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just
      - run: just fmt-check

  clippy:
    name: clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .cargo/config.toml links the host target with mold, so CI needs it too.
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just
      - run: just lint

  test-shard:
    # The suite is CPU-bound on a 4-core runner, so two runners halve it; 8 threads on one did not (Y-605).
    name: test (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just,cargo-nextest
      # ubuntu-24.04 ships podman preinstalled; fail loudly here rather than
      # let the Y-031 fixture quietly fall back to its SKIPPED path below.
      # Versions are printed because the runner image upgrades them underneath us
      # — image 20260726.254 moved podman 4.9.3 → 5.8.4 and broke the build (Y-048).
      - name: Verify podman is available
        run: |
          podman --version
          crun --version | head -1 || true
          runc --version | head -1 || true
      # On that image podman 5.8.4 + crun 1.28 fail with "unknown version specified";
      # runc 1.4.3 on the very same image works. Verified on both images (Y-048).
      - name: Pin the OCI runtime to runc
        run: |
          mkdir -p ~/.config/containers
          printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
      - run: just test-ci --partition count:${{ matrix.shard }}/2

  test:
    # The ruleset requires a check named `test`; this one passes only when every shard does.
    name: test
    needs: test-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.test-shard.result }}" = success -o "${{ needs.test-shard.result }}" = skipped

  macos:
    # A real Mac: bash 3.2 as /bin/sh, BSD tools, Homebrew's tmux and launchd (Y-661).
    # The runner sshes to itself, so no secret, tailnet or self-hosted runner is needed.
    name: macos
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just,cargo-nextest
      # Into /opt/homebrew/bin, which is off the ssh PATH as on the owner's Mac (I-34).
      - name: Install tmux
        run: brew install tmux
      - name: Let the runner ssh to itself
        run: |
          set -euo pipefail
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_yantra_ci
          cat ~/.ssh/id_yantra_ci.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          printf 'Host yantra-ci-mac\n  HostName 127.0.0.1\n  User %s\n  IdentityFile ~/.ssh/id_yantra_ci\n  IdentitiesOnly yes\n' "$USER" >> ~/.ssh/config
          for _ in $(seq 30); do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new yantra-ci-mac 'echo "$SHELL"; /bin/bash --version | head -1'; then exit 0; fi
            sleep 1
          done
          echo "::error::sshd on the runner never answered"; exit 1
      - run: just test-macos yantra-ci-mac

  deny:
    name: deny
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just,cargo-deny
      - run: just deny

  pinned:
    # A tag is mutable and an action runs with the job's token, so `release.yml`
    # taking one would put a stranger's code next to a `contents: write`. Needs
    # no toolchain: it reads the workflows.
    name: pinned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just
      - run: just pinned

  shellcheck:
    # Pinned: a newer shellcheck adds findings, and `just shellcheck` fails on any.
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just,shellcheck@0.11.0
      - run: just shellcheck

  agents:
    # Codex, Grok and opencode read AGENTS.md. Needs no toolchain: it reads symlinks.
    name: agents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just
      - run: just agents

  no-node:
    # R-24's assertion, and it is the negative one the other jobs cannot make:
    # that this file is green proves the default build works, never that no job
    # here turned the embed feature on to get there. See the recipe.
    name: no-node
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just
      - run: just no-node

  build-without-node:
    # R-24's condition, made rather than found: this runner ships Node, so the
    # gate's own build and lint run here with the three binaries shadowed by
    # stubs that fail. The job above reads what the recipes say; this one is
    # what a `build.rs` shelling out to npm actually meets.
    name: build without node
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just
      - run: just build-without-node

  cross:
    # The Pi 5 appliance target. ADR-0004 chose Rust partly because this build
    # is a one-liner, so it is a first-class gate rather than a release detail.
    name: cross (aarch64-unknown-linux-musl)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      # cargo-zigbuild needs a zig; the version lives in the composite action.
      - name: Set up zig
        uses: ./.github/actions/setup-zig
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just,cargo-zigbuild
      - run: just appliance aarch64-unknown-linux-musl

      # A cross-build that silently produces x86_64 binaries would pass every
      # other check in this file. Assert the ELF header instead of trusting it.
      - name: Assert the binaries are statically linked aarch64
        run: |
          set -euo pipefail
          for bin in yantrad yantra yantra-agent; do
            path="target/aarch64-unknown-linux-musl/release/$bin"
            info=$(file -b "$path")
            echo "$bin: $info"
            case "$info" in
              *"ARM aarch64"*"statically linked"*) ;;
              *) echo "::error::$bin is not a statically linked aarch64 binary"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yantra-aarch64-unknown-linux-musl
          path: |
            target/aarch64-unknown-linux-musl/release/yantrad
            target/aarch64-unknown-linux-musl/release/yantra
            target/aarch64-unknown-linux-musl/release/yantra-agent
          if-no-files-found: error
          retention-days: 14
