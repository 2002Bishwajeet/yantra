# Every job below runs a recipe from the justfile, so `just ci` locally and a
# green PR mean the same thing. Add a new check to the justfile first, then
# give it a job here — never the other way round.
#
# No version is pinned in this file. The Rust toolchain — channel, components
# and the aarch64 target — comes from rust-toolchain.toml via the shared
# .github/actions/setup-rust action; zig comes from .github/actions/setup-zig.
# Both are shared with release.yml, so there is one place to bump each.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded pushes to a PR branch are cancelled; pushes to main are not, so
# every commit that lands keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just
      - run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .cargo/config.toml links the host target with mold, so CI needs it too.
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just
      - run: just lint

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just,cargo-nextest
      # ubuntu-24.04 ships podman preinstalled; fail loudly here rather than
      # let the Y-031 fixture quietly fall back to its SKIPPED path below.
      # Versions are printed because the runner image upgrades them underneath us
      # — image 20260726.254 moved podman 4.9.3 → 5.8.4 and broke the build (Y-048).
      - name: Verify podman is available
        run: |
          podman --version
          crun --version | head -1 || true
          runc --version | head -1 || true
      # On that image podman 5.8.4 + crun 1.28 fail with "unknown version specified";
      # runc 1.4.3 on the very same image works. Verified on both images (Y-048).
      - name: Pin the OCI runtime to runc
        run: |
          mkdir -p ~/.config/containers
          printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
      - run: just test-ci

  deny:
    name: deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just,cargo-deny
      - run: just deny

  no-node:
    # R-24's assertion, and it is the negative one the other jobs cannot make:
    # that this file is green proves the default build works, never that no job
    # here turned the embed feature on to get there. See the recipe.
    name: no-node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just
      - run: just no-node

  cross:
    # The Pi 5 appliance target. ADR-0004 chose Rust partly because this build
    # is a one-liner, so it is a first-class gate rather than a release detail.
    name: cross (aarch64-unknown-linux-musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      # cargo-zigbuild needs a zig; the version lives in the composite action.
      - name: Set up zig
        uses: ./.github/actions/setup-zig
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just,cargo-zigbuild
      - run: just appliance

      # A cross-build that silently produces x86_64 binaries would pass every
      # other check in this file. Assert the ELF header instead of trusting it.
      - name: Assert the binaries are statically linked aarch64
        run: |
          set -euo pipefail
          for bin in yantrad yantra yantra-agent; do
            path="target/aarch64-unknown-linux-musl/release/$bin"
            info=$(file -b "$path")
            echo "$bin: $info"
            case "$info" in
              *"ARM aarch64"*"statically linked"*) ;;
              *) echo "::error::$bin is not a statically linked aarch64 binary"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yantra-aarch64-unknown-linux-musl
          path: |
            target/aarch64-unknown-linux-musl/release/yantrad
            target/aarch64-unknown-linux-musl/release/yantra
            target/aarch64-unknown-linux-musl/release/yantra-agent
          if-no-files-found: error
          retention-days: 14
