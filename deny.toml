# cargo-deny: licence and advisory policy.

# An optional dependency is still one this repo ships, and `yantrad`'s
# `embed-dashboard` is off by default, so a resolve without it would audit
# nothing that feature adds. Here rather than as `--all-features` on the recipe:
# that flag must never appear in a `just` recipe (Y-140, R-24), and this is a
# metadata resolve rather than a build, so it costs no npm.
[graph]
all-features = true

[advisories]
yanked = "deny"

# `CDLA-Permissive-2.0` is here for `webpki-roots` and covers **data rather than
# code**: Mozilla's root certificate list, which a static musl binary has to
# carry because the appliance image is not promised a system trust store (Y-146).
# It is the one licence in this list that arrived with a dependency instead of
# preceding it.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
